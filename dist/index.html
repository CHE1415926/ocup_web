<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="在一张可探索的三维书桌上，翻阅文稿、打开日记、点亮油灯并体验电报收发。">
  <meta name="theme-color" content="#201710">
  <title>行军案头 · 长征档案室</title>
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body data-view="room">
  <canvas id="scene" aria-label="长征主题的三维书桌"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <main>
    <div id="objects" class="sr-only" role="group" aria-label="场景物件" hidden>
      <button data-object="paper">查看桌上文稿</button>
      <button data-object="diary">打开日记本</button>
      <button data-object="lamp" aria-pressed="false">点亮或熄灭油灯</button>
      <button data-object="radio">操作电报机</button>
      <button data-object="map">查看长征地图</button>
    </div>
    <button id="back" class="back" type="button" hidden><span aria-hidden="true">←</span> 返回书桌 <kbd>Esc</kbd></button>
    <div id="pager" class="pager" hidden aria-label="文稿翻页">
      <button id="prev" type="button" aria-label="上一页">←</button>
      <span id="page-number" aria-live="polite">01 / 03</span>
      <button id="next" type="button" aria-label="下一页">→</button>
    </div>
    <div id="reading" class="sr-only" aria-live="polite"></div>
    <section id="terminal" class="terminal" hidden aria-labelledby="terminal-title">
      <div class="terminal-header"><div><p>FIELD TELEGRAPH / 04</p><h3 id="terminal-title">电报收发室</h3></div><span id="signal-status">待机</span></div>
      <div class="signal" aria-hidden="true"></div>
      <ol id="messages" aria-label="电报记录" aria-live="polite"><li class="system">已接入演示频段。输入电文，体验发报和回执。</li></ol>
      <form id="telegraph-form">
        <label for="telegram" class="sr-only">输入电文</label>
        <input id="telegram" type="text" maxlength="120" autocomplete="off" placeholder="输入一封电文…" required>
        <button id="send" type="submit">发报 <span aria-hidden="true">↗</span></button>
      </form>
      <p class="terminal-foot">本地模拟 · FIELD SIGNAL DEMO</p>
    </section>
    <p class="notice" id="notice" role="status">正在布置案头…</p>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
